[package]
name = "app-state"
version = "0.0.0"
edition = "2021"
publish = false

# Geen Tauri-afhankelijkheid — apart testbaar, net als vault-core. Deze crate
# is de enige plek die naar Application Support schrijft; vault-core mag dat
# niet (Goal W1 §11) en de Tauri-schil evenmin (07 §4.3).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
