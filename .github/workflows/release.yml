# Bouwt Lapis.dmg op een macOS-runner en zet hem als GitHub-release online.
#
# Uitbrengen: zet dezelfde versie in app/package.json, app/src-tauri/Cargo.toml
# en app/src-tauri/tauri.conf.json, en push een tag:
#   git tag v0.1.0 && git push origin v0.1.0
# De download staat daarna op .../releases/latest/download/Lapis.dmg.
#
# Handmatig starten (Actions → Release → Run workflow) bouwt alleen de DMG als
# artifact, zonder release — om de build te proberen vóór je een tag zet.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Een tag die niet klopt met de versie in de app levert een release op
      # waarvan "Over Lapis" iets anders zegt dan de downloadpagina.
      - name: Versie controleren
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in \
            "$(node -p "require('./app/package.json').version")" \
            "$(node -p "require('./app/src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -1)"; do
            [ "$v" = "$tag" ] || { echo "::error::tag $GITHUB_REF_NAME, maar versie in de app is $v"; exit 1; }
          done

      - name: DMG bouwen
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lapis.dmg
          path: Lapis.dmg

      - name: Release maken
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Lapis.dmg --title "Lapis $GITHUB_REF_NAME" --generate-notes
